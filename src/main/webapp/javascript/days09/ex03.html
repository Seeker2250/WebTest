<div>

  <!-- 기본 이벤트 취소 -->
  <a onclick="return test1();" href="http://www.naver.com">naver</a>
  <br>


  <a href="http://www.naver.com">naver</a>
  <script>
    function test1(){
      let result =confirm("이동 확인");
      // alert(result);//true / false
      return result;//취소 false 확인 true
    }


    // JQuery로 기본 이벤트 취소
    $("a").last().on("click", function(event){
      let result =confirm("이동 확인");
      if(!result){//취소
        // event.stopPropagation();//이벤트 버블링(자식->부모) stop
        event.preventDefault();
      }
    })
  </script>
